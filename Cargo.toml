[workspace]
resolver = "2"
members = ["crates/venue-proto", "gateway", "venues/hyperliquid"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
venue-proto = { path = "crates/venue-proto" }
